<style>
  :root {
    --ink: #0e1220;
    --panel: #161b2e;
    --panel-2: #1f2740;
    --aether: #6fd6e0;
    --aether-dim: #3a8f98;
    --gold: #e8c27a;
    --danger: #e0716f;
    --text: #eef1fb;
    --text-dim: #9aa3c0;
    --font-display: 'Cinzel', 'Iowan Old Style', Georgia, serif;
    --font-body: 'Zen Maru Gothic', 'Hiragino Sans', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  #root {
    min-height: 100vh;
    position: relative;
    background:
      radial-gradient(circle at 50% -10%, #24325a 0%, transparent 55%),
      radial-gradient(circle at 90% 100%, #2a1f45 0%, transparent 50%),
      var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    padding: 28px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background-color 0.15s ease-out, filter 0.9s ease-in;
  }
  #root.final-miss { filter: grayscale(0.75) brightness(0.8); }
  .bg-dummy {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    height: 94%; width: auto;
    color: var(--text);
    opacity: 0.18;
    pointer-events: none;
  }
  .life-warning-overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(224,113,111,0.5) 100%);
    opacity: 0; transition: opacity 0.4s ease;
  }
  #root.low-life .life-warning-overlay {
    opacity: 1;
    animation: life-warning-pulse 1.1s ease-in-out infinite;
  }
  @keyframes life-warning-pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  #livesLabel.low-life-hearts { animation: low-life-heart-pulse 0.9s ease-in-out infinite; display: inline-block; }
  @keyframes low-life-heart-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }

  /* 1/4刻みのハート表示(クリティカル回復に対応) */
  .lives-wrap { position: relative; display: inline-block; }
  #livesLabel { display: inline-flex; gap: 2px; letter-spacing: 0; }
  .heart-slot {
    position: relative; display: inline-block; width: 15px; height: 15px;
    font-size: 15px; line-height: 1;
  }
  .heart-slot .heart-bg, .heart-slot .heart-fg {
    position: absolute; top: 0; left: 0; white-space: nowrap;
  }
  .heart-slot .heart-bg { color: #3a3f55; }
  .heart-slot .heart-fg { color: var(--danger); overflow: hidden; }
  .heart-slot.healing { animation: heart-heal-pulse 0.5s ease-out; }
  @keyframes heart-heal-pulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(120,255,170,0)); }
    40% { transform: scale(1.5); filter: drop-shadow(0 0 6px rgba(120,255,170,0.95)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(120,255,170,0)); }
  }
  .heal-popup-layer { position: absolute; top: -4px; left: 50%; pointer-events: none; }
  .heal-popup {
    position: absolute; left: 0; top: 0; transform: translateX(-50%);
    font-family: var(--font-display); font-weight: 800; font-size: 13px;
    color: #8fffc0; text-shadow: 0 0 8px rgba(140,255,180,0.9);
    white-space: nowrap;
    animation: heal-popup-float 0.9s ease-out forwards;
  }
  @keyframes heal-popup-float {
    0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
    20% { transform: translate(-50%, -6px) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -26px) scale(1); opacity: 0; }
  }

  #root.bg-flash-crit { background-color: #3a2f0f; }
  #root.bg-flash-miss { background-color: #3a1414; }
  #root.bg-flash-fever-miss { background-color: #3a3014; }
  #root.shake-small { animation: shake-small 0.25s; }
  #root.shake-big { animation: shake-big 0.4s; }
  #root.shake-mega { animation: shake-mega 0.8s; }
  #root.shake-shield { animation: shake-shield 0.22s; }
  @keyframes shake-small {
    10%, 90% { transform: translate(-1px, 0); }
    20%, 80% { transform: translate(2px, -1px); }
    30%, 50%, 70% { transform: translate(-3px, 1px); }
    40%, 60% { transform: translate(3px, -1px); }
  }
  @keyframes shake-big {
    10%, 90% { transform: translate(-3px, 1px) rotate(-0.3deg); }
    20%, 80% { transform: translate(6px, -2px) rotate(0.3deg); }
    30%, 50%, 70% { transform: translate(-9px, 2px) rotate(-0.5deg); }
    40%, 60% { transform: translate(9px, -3px) rotate(0.5deg); }
  }
  @keyframes shake-mega {
    5%, 95% { transform: translate(-6px, 2px) rotate(-0.6deg); }
    15%, 85% { transform: translate(12px, -5px) rotate(0.8deg); }
    25%, 75% { transform: translate(-18px, 6px) rotate(-1deg); }
    35%, 65% { transform: translate(18px, -6px) rotate(1deg); }
    45%, 55% { transform: translate(-14px, 4px) rotate(-0.7deg); }
    50% { transform: translate(14px, -4px) rotate(0.7deg); }
  }
  /* フィーバー中のミス:痛みではなく「弾かれた」軽い揺れ(無敵感の演出) */
  @keyframes shake-shield {
    20%, 80% { transform: translate(2px, 0) scale(1.01); }
    40%, 60% { transform: translate(-2px, 0) scale(0.99); }
    50% { transform: translate(1px, 0) scale(1.005); }
  }

  .title-block { text-align: center; margin-bottom: 18px; max-width: 460px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.35em; color: var(--aether);
    text-transform: uppercase; margin-bottom: 6px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 30px; margin: 0; letter-spacing: 0.06em;
    background: linear-gradient(180deg, #fff, var(--aether) 140%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .card {
    position: relative;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid #2c3559;
    border-radius: 16px;
    padding: 22px;
    width: 100%; max-width: 460px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }
  .sound-toggle {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    width: 30px; height: 30px; border-radius: 50%;
    background: #0e1327; border: 1px solid #333e66; color: var(--text);
    font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #playView, #doneView { opacity: 1; transition: opacity 0.5s ease; }
  #playView.fade-out { opacity: 0; }
  #doneView.fade-in-start { opacity: 0; }

  .rule-box {
    background: #0e1327; border: 1px solid #262e4d; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; font-size: 12px; color: var(--text-dim);
  }
  .rule-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.crit { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  .dot.hit { background: var(--aether); box-shadow: 0 0 6px var(--aether); }
  .dot.miss { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

  .stage {
    position: relative; height: 220px; border-radius: 12px;
    overflow: hidden; margin-bottom: 14px; border: 1px solid #2c3559;
    background: #10152a;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  .fever-gauge {
    position: relative; height: 16px; border-radius: 8px; overflow: hidden;
    background: #0e1327; border: 1px solid #262e4d; margin-top: -2px;
  }
  .fever-gauge-label {
    position: absolute; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 9px; font-weight: 700;
    letter-spacing: 0.14em; color: var(--text-dim); pointer-events: none;
  }
  .fever-gauge-fill {
    position: absolute; left: 0; top: 0; z-index: 2;
    height: 100%; width: 0%; border-radius: 8px;
    background: linear-gradient(90deg, var(--aether-dim), var(--aether));
    transition: width 0.15s linear;
  }
  .fever-gauge-fill.active {
    background: linear-gradient(90deg, #ff8fd0, #ffd66b, #6fd6e0, #ff8fd0, #ff8fd0);
    background-size: 300% auto;
    animation: fever-banner-hue 1.1s linear infinite;
    box-shadow: 0 0 14px rgba(255,255,255,0.65), 0 0 26px rgba(255,214,107,0.55);
  }

  /* 実績システム */
  .achievement-toast {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    width: 84%; max-width: 260px; padding: 10px 16px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(22,27,46,0.55), rgba(31,39,64,0.55));
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--gold);
    box-shadow: 0 0 24px rgba(232,194,122,0.55), 0 10px 30px rgba(0,0,0,0.5);
    text-align: center; opacity: 0; pointer-events: none; z-index: 5;
  }
  .achievement-toast.show { animation: achievement-toast-anim 2.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  @keyframes achievement-toast-anim {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
    12% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    22% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.96); opacity: 0; }
  }
  .achievement-toast-title {
    font-family: var(--font-display); font-weight: 800; font-size: 12px;
    letter-spacing: 0.1em; color: var(--gold); margin-bottom: 4px;
    text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 10px rgba(232,194,122,0.8);
  }
  .achievement-toast-name {
    font-family: var(--font-display); font-weight: 900; font-size: 18px;
    color: var(--text); margin-bottom: 3px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.7);
  }
  .achievement-toast-desc {
    font-size: 11px; color: var(--text-dim);
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }

  .achievement-list {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
    min-height: 0;
  }
  .achievement-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; padding: 4px 9px; border-radius: 999px;
    background: rgba(232,194,122,0.12); border: 1px solid rgba(232,194,122,0.5);
    color: var(--gold); white-space: nowrap;
    animation: achievement-chip-in 0.35s ease-out;
  }
  @keyframes achievement-chip-in {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .result-achievements {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    margin-bottom: 14px;
  }
  .result-achievements .achievement-chip { font-size: 12px; padding: 5px 11px; }
  .result-achievements-empty {
    font-size: 12px; color: var(--text-dim); text-align: center; margin-bottom: 14px;
  }

  .track-inner {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(224,113,111,0.22) 0%, transparent 18%, transparent 82%, rgba(224,113,111,0.22) 100%),
      repeating-linear-gradient(90deg, #10152a, #10152a 2px, #141a33 2px, #141a33 4px);
    transform-origin: center center;
    transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
    will-change: transform;
  }
  .track-inner.zoom-out-slow {
    transition: transform 1.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .hit-zone {
    position: absolute; top: 0; bottom: 0;
    background: rgba(111, 214, 224, 0.14);
    border-left: 2px solid var(--aether-dim);
    border-right: 2px solid var(--aether-dim);
  }
  .crit-zone {
    position: absolute; top: 0; bottom: 0;
    background: rgba(232, 194, 122, 0.22);
    border-left: 2px solid var(--gold);
    border-right: 2px solid var(--gold);
  }
  .cursor {
    position: absolute; top: 0; bottom: 0; width: 3px; left: 0;
    background: var(--gold);
    box-shadow: 0 0 12px var(--gold), 0 0 24px rgba(232,194,122,0.5);
    transition: box-shadow 0.15s;
  }
  .flash-overlay {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    transition: opacity 0.35s ease-out;
  }
  .pop-layer, .particle-layer {
    position: absolute; inset: 0; pointer-events: none; overflow: visible;
  }
  .pop-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    font-family: var(--font-display); font-weight: 700; white-space: nowrap;
    opacity: 0; animation: pop-anim 0.75s ease-out forwards;
  }
  @keyframes pop-anim {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    25% { transform: translate(-50%, -65%) scale(1.25); opacity: 1; }
    100% { transform: translate(-50%, -110%) scale(1); opacity: 0; }
  }
  .pop-text-score {
    top: 68%;
    animation: pop-anim-score 0.7s ease-out forwards;
  }
  @keyframes pop-anim-score {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    25% { transform: translate(-50%, -60%) scale(1.05); opacity: 1; }
    100% { transform: translate(-50%, -95%) scale(1); opacity: 0; }
  }
  .particle {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    top: 50%; left: 50%; opacity: 1;
    animation: particle-fly 0.6s ease-out forwards;
  }
  @keyframes particle-fly {
    to { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
  .slash {
    position: absolute; top: 50%; left: 50%;
    width: 110px; height: 4px; margin-top: -2px; margin-left: -55px;
    border-radius: 4px;
    transform-origin: center;
    animation: slash-anim 0.32s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
  }
  @keyframes slash-anim {
    0% { transform: rotate(var(--rot)) scaleX(0) ; opacity: 0; }
    15% { opacity: 1; }
    55% { transform: rotate(var(--rot)) scaleX(1.5); opacity: 1; }
    100% { transform: rotate(var(--rot)) scaleX(1.9); opacity: 0; }
  }
  .slash-final {
    width: 220px; height: 7px; margin-top: -3.5px; margin-left: -110px;
    border-radius: 6px;
    animation: slash-anim-final 1.45s cubic-bezier(0.1, 0.85, 0.15, 1) forwards;
  }
  @keyframes slash-anim-final {
    0% { transform: rotate(var(--rot)) scaleX(0); opacity: 0; filter: brightness(1.6); }
    8% { opacity: 1; }
    35% { transform: rotate(var(--rot)) scaleX(2.4); opacity: 1; filter: brightness(2); }
    70% { transform: rotate(var(--rot)) scaleX(2.7); opacity: 0.95; filter: brightness(1.7); }
    100% { transform: rotate(var(--rot)) scaleX(2.9); opacity: 0; filter: brightness(1.2); }
  }
  .ring {
    position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
    margin-top: -7px; margin-left: -7px;
    border-radius: 50%; border: 2px solid;
    animation: ring-anim 0.5s ease-out forwards;
  }
  @keyframes ring-anim {
    0% { transform: scale(0.4); opacity: 0.9; }
    100% { transform: scale(4.2); opacity: 0; }
  }
  .tap-ripple {
    position: absolute; top: 50%; left: 50%; width: 36px; height: 36px;
    margin-top: -18px; margin-left: -18px;
    border-radius: 50%; border: 3px solid rgba(255,255,255,0.95);
    box-shadow: 0 0 14px rgba(255,255,255,0.7), inset 0 0 10px rgba(255,255,255,0.4);
    animation: tap-ripple-anim 0.5s ease-out forwards;
  }
  @keyframes tap-ripple-anim {
    0% { transform: scale(0.2); opacity: 0.95; }
    100% { transform: scale(3.2); opacity: 0; }
  }
  .combo-popup {
    position: absolute; top: 6px; left: 50%;
    transform: translate(-50%, -4px) scale(0.4);
    font-family: var(--font-display); font-weight: 800; font-size: 24px;
    letter-spacing: 0.03em; opacity: 0; pointer-events: none;
  }
  .combo-popup.show { animation: combo-popup-anim 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  @keyframes combo-popup-anim {
    0% { transform: translate(-50%, -4px) scale(0.4); opacity: 0; }
    30% { transform: translate(-50%, 0) scale(1.3); opacity: 1; }
    70% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    100% { transform: translate(-50%, 0) scale(1); opacity: 0; }
  }
  .start-hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: var(--font-display); font-weight: 700; font-size: 18px;
    color: var(--text); letter-spacing: 0.08em; text-align: center;
    text-shadow: 0 0 10px rgba(238,241,251,0.6);
    pointer-events: none; white-space: nowrap;
    animation: start-hint-blink 1.6s ease-in-out infinite;
  }
  @keyframes start-hint-blink {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }

  .hud { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }
  .hud b { color: var(--text); font-weight: 700; font-size: 15px; transition: transform 0.15s; display: inline-block; }
  #comboLabel.combo-pop { animation: combo-pop 0.3s ease-out; color: var(--gold); }
  @keyframes combo-pop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .zone-legend {
    display: flex; justify-content: center; gap: 16px;
    font-size: 11px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 0.02em;
  }
  .zone-legend span { display: inline-flex; align-items: center; gap: 5px; }
  #livesLabel { letter-spacing: 2px; }

  button.primary {
    width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: linear-gradient(180deg, var(--aether), var(--aether-dim));
    color: #08131a; font-weight: 700; font-size: 15px; cursor: pointer;
    letter-spacing: 0.03em; font-family: var(--font-body);
    transition: transform 0.1s;
  }
  button.primary:active { transform: scale(0.97); }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.ghost {
    width: 100%; padding: 10px; border-radius: 10px; margin-top: 8px;
    background: transparent; border: 1px solid #3a4470; color: var(--text-dim);
    font-size: 13px; cursor: pointer; font-family: var(--font-body);
  }
  .result-flash {
    text-align: center; font-family: var(--font-display); font-size: 20px;
    height: 26px; margin-bottom: 8px; letter-spacing: 0.05em;
  }
  .result-flash.perfect { color: var(--gold); }
  .result-flash.good { color: var(--aether); }
  .result-flash.miss { color: var(--danger); }

  /* 色収差(クロマティックアベレーション)風の演出:mix-blend-modeで色ズレを疑似再現(SafariでもOK) */
  .chroma-layer {
    position: absolute; inset: -8px; pointer-events: none;
    mix-blend-mode: screen; opacity: 0;
  }
  .chroma-layer.show { animation: chroma-layer-anim linear forwards; }
  @keyframes chroma-layer-anim {
    0% { opacity: var(--chroma-peak, 0.55); }
    100% { opacity: 0; }
  }

  /* フィーバータイム */
  .fever-tag {
    display: none; text-align: center; font-family: var(--font-display);
    font-weight: 800; font-size: 12px; letter-spacing: 0.08em; color: #ffd66b;
    margin: -4px 0 8px; text-shadow: 0 0 8px rgba(255,214,107,0.8);
    animation: fever-tag-pulse 0.9s ease-in-out infinite;
  }
  .fever-tag.show { display: block; }
  @keyframes fever-tag-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  .fever-hp-icons { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; }
  .fever-hp-icon {
    font-size: 12px; opacity: 1; transform: scale(1);
    transition: opacity 0.25s ease, transform 0.25s ease, filter 0.25s ease;
    filter: drop-shadow(0 0 3px rgba(255,214,107,0.9));
  }
  .fever-hp-icon.lost {
    opacity: 0; transform: scale(0.3) rotate(20deg);
    filter: none;
  }
  .fever-hp-icon.warning {
    animation: fever-hp-warning 0.5s ease-in-out infinite;
    filter: drop-shadow(0 0 5px rgba(255,120,60,0.95));
  }
  @keyframes fever-hp-warning { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  .card.fever { animation: fever-glow 1.1s ease-in-out infinite; }
  @keyframes fever-glow {
    0%, 100% { box-shadow: 0 0 30px 3px rgba(255, 100, 180, 0.5), 0 20px 50px -20px rgba(0,0,0,0.6); }
    50% { box-shadow: 0 0 46px 8px rgba(120, 200, 255, 0.55), 0 20px 50px -20px rgba(0,0,0,0.6); }
  }
  .fever-banner {
    position: absolute; bottom: 6%; top: auto; left: 50%; transform: translate(-50%, 0) scale(0.85);
    font-family: var(--font-display); font-weight: 900; font-size: 26px;
    letter-spacing: 0.08em; white-space: nowrap; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, #ff8fd0, #ffd66b, #6fd6e0, #ff8fd0);
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 14px rgba(255,255,255,0.35);
    transition: opacity 0.3s ease;
  }
  .fever-banner.active {
    opacity: 1;
    animation: fever-banner-hue 1.6s linear infinite, fever-banner-pulse 1s ease-in-out infinite;
  }
  @keyframes fever-banner-pulse {
    0%, 100% { transform: translate(-50%, 0) scale(0.92); }
    50% { transform: translate(-50%, 0) scale(1.08); }
  }
  @keyframes fever-banner-hue { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

  /* フィーバー中バリア使用時:画面全体に広がる青い波紋 */
  .barrier-ripple-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 40;
    overflow: hidden;
  }
  .barrier-ripple {
    position: absolute; top: 50%; left: 50%;
    width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%;
    border: 5px solid rgba(120, 220, 255, 0.85);
    box-shadow: 0 0 30px rgba(120, 220, 255, 0.7), inset 0 0 40px rgba(120, 220, 255, 0.4);
    animation: barrier-ripple-expand 0.85s cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
  }
  @keyframes barrier-ripple-expand {
    0% { width: 10px; height: 10px; margin: -5px 0 0 -5px; opacity: 0.9; border-width: 8px; }
    70% { opacity: 0.45; }
    100% {
      width: 240vmax; height: 240vmax; margin: -120vmax 0 0 -120vmax;
      opacity: 0; border-width: 1px;
    }
  }

  /* 蘇生チャンス(himechanの約束)QTE */
  .revival-overlay {
    display: none; position: fixed; inset: 0; z-index: 55;
    background: radial-gradient(circle at 50% 38%, rgba(70,15,110,0.94), rgba(8,4,18,0.98));
    align-items: center; justify-content: center; flex-direction: column;
    text-align: center; padding: 24px; cursor: pointer;
  }
  .revival-overlay.show { display: flex; animation: revival-vignette-pulse 1s ease-in-out infinite; }
  @keyframes revival-vignette-pulse {
    0%, 100% { box-shadow: inset 0 0 0 rgba(170,70,255,0); }
    50% { box-shadow: inset 0 0 130px rgba(170,70,255,0.6); }
  }
  .revival-title {
    font-family: var(--font-display); font-weight: 900; font-size: 25px;
    color: #ffe27a; letter-spacing: 0.08em; margin-bottom: 8px;
    text-shadow: 0 0 18px rgba(255,220,120,0.9), 0 0 36px rgba(170,70,255,0.7);
    animation: revival-title-pulse 0.6s ease-in-out infinite;
  }
  @keyframes revival-title-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .revival-sub { color: #d9caff; font-size: 12.5px; margin-bottom: 22px; max-width: 320px; }
  .revival-stage {
    position: relative; width: 90%; max-width: 380px; height: 90px;
    border-radius: 12px; overflow: hidden;
    background: repeating-linear-gradient(90deg, #170b28, #170b28 2px, #1f1138 2px, #1f1138 4px);
    border: 2px solid #a852ff; box-shadow: 0 0 34px rgba(170,70,255,0.55);
  }
  .revival-zone {
    position: absolute; top: 0; bottom: 0;
    background: rgba(255,214,107,0.28);
    border-left: 2px solid #ffd66b; border-right: 2px solid #ffd66b;
  }
  .revival-cursor {
    position: absolute; top: 0; bottom: 0; width: 3px; left: 0;
    background: #ffffff; box-shadow: 0 0 12px #ffffff, 0 0 26px #a852ff;
  }
  .revival-result {
    margin-top: 18px; font-family: var(--font-display); font-weight: 800; font-size: 20px;
    min-height: 26px;
  }
  .revival-result.success { color: #8fffc0; text-shadow: 0 0 14px rgba(140,255,180,0.9); }
  .revival-result.fail { color: var(--danger); text-shadow: 0 0 14px rgba(224,113,111,0.9); }
  .revival-progress {
    margin-top: 14px; display: flex; align-items: center; justify-content: center;
    gap: 8px; font-size: 12px; color: #d9caff;
  }
  .revival-progress-label.fail-label { margin-left: 10px; }
  .revival-dots { display: inline-flex; gap: 4px; }
  .revival-dots span {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35);
  }
  .revival-dots span.filled-success { background: #8fffc0; border-color: #8fffc0; box-shadow: 0 0 8px rgba(140,255,180,0.8); }
  .revival-dots span.filled-fail { background: var(--danger); border-color: var(--danger); box-shadow: 0 0 8px rgba(224,113,111,0.8); }

  /* 蘇生成功時:Raise画像が半透明でズームアップしながらフェードアウト */
  .revival-success-img {
    display: none; position: fixed; top: 50%; left: 50%;
    width: 130px; height: 130px;
    pointer-events: none; z-index: 60;
    opacity: 0; transform: translate(-50%, -50%) scale(1);
    filter: drop-shadow(0 0 20px rgba(140,220,255,0.8));
  }
  .revival-success-img.play {
    display: block;
    animation: revival-raise-zoom 1.2s cubic-bezier(0.15, 0.6, 0.35, 1) forwards;
  }
  @keyframes revival-raise-zoom {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    15% { opacity: 0.85; }
    70% { opacity: 0.6; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(6); }
  }

  .end-summary { text-align: center; margin-bottom: 14px; }
  .end-summary .big { font-family: var(--font-display); font-size: 34px; color: var(--gold); }

  /* 自己ベスト更新演出 */
  #doneView { position: relative; overflow: visible; }
  .new-best-banner {
    display: none; text-align: center; font-family: var(--font-display);
    font-weight: 800; font-size: 20px; letter-spacing: 0.06em;
    color: #fff2c2; margin-bottom: 10px;
    text-shadow: 0 0 12px rgba(255,214,107,0.95), 0 0 24px rgba(255,150,60,0.6);
    animation: new-best-pop 0.6s ease-out, new-best-glow 1s ease-in-out infinite 0.6s;
  }
  .new-best-banner.show { display: block; }
  @keyframes new-best-pop {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes new-best-glow {
    0%, 100% { text-shadow: 0 0 12px rgba(255,214,107,0.95), 0 0 24px rgba(255,150,60,0.6); }
    50% { text-shadow: 0 0 20px rgba(255,214,107,1), 0 0 40px rgba(255,150,60,0.9); }
  }
  .confetti-layer {
    position: absolute; inset: -20px -20px auto -20px; height: 260px;
    pointer-events: none; overflow: hidden; z-index: 5;
  }
  .confetti-piece {
    position: absolute; top: -14px; width: 8px; height: 14px;
    opacity: 0.95; animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.95; }
    100% { transform: translateY(280px) rotate(600deg); opacity: 0; }

  function judge(pos) {
    const dist = Math.abs(pos - 50);
    if (dist <= CRIT_HALF) {
      const isPerfect = dist <= CRIT_HALF * 0.35;
      return {
        label: isPerfect ? 'パーフェクト' : 'クリティカル',
        cls: 'perfect',
        type: isPerfect ? 'perfectCrit' : 'crit',
        score: Math.round((isPerfect ? 190 : 150) - dist * 10)
      };
    }
    if (dist <= HIT_HALF) return { label: 'ヒット', cls: 'good', type: 'hit', score: Math.round(70 - dist * 1.5) };
    if (dist <= HIT_HALF + NEAR_MISS_MARGIN) return { label: 'ニアミス', cls: 'miss', type: 'nearMiss', score: 0 };
    return { label: 'ミス', cls: 'miss', type: 'miss', score: 0 };
  }

  function renderHearts() {
    livesLabel.innerHTML = '';
    for (let i = 0; i < MAX_LIVES; i++) {
      const fillRatio = Math.max(0, Math.min(1, lives - i)); // このハートの充填率(0〜1)
      const slot = document.createElement('span');
      slot.className = 'heart-slot';
      slot.innerHTML =
        '<span class="heart-bg">♥</span>' +
        '<span class="heart-fg" style="width:' + (fillRatio * 100) + '%">♥</span>';
      livesLabel.appendChild(slot);
    }
  }

  function updateHud() {
    totalLabel.textContent = score;
    comboLabel.textContent = combo;
    renderHearts();
    const isLowLife = lives > 0 && lives <= 1;
    rootEl.classList.toggle('low-life', isLowLife);
    livesLabel.classList.toggle('low-life-hearts', isLowLife);
  }

  function shake(kind) {
    rootEl.classList.remove('shake-small', 'shake-big', 'shake-mega', 'shake-shield');
    void rootEl.offsetWidth; // reflow to restart animation
    rootEl.classList.add(kind);
    setTimeout(() => rootEl.classList.remove(kind), kind === 'shake-mega' ? 850 : (kind === 'shake-shield' ? 250 : 450));
  }

  function bgFlash(kind) {
    rootEl.classList.remove('bg-flash-crit', 'bg-flash-miss', 'bg-flash-fever-miss');
    void rootEl.offsetWidth;
    rootEl.classList.add(kind);
    setTimeout(() => rootEl.classList.remove(kind), 220);
  }

  function triggerChroma(big) {
    // 実際のピクセルをずらすSVGフィルターの代わりに、色付きレイヤーを僅かにオフセットして重ね、
    // mix-blend-modeで色ズレ風の見た目を作る(Safari/iOSでも確実に描画される)
    const offset = big ? 11 : 5;
    const duration = big ? 300 : 200;
    const peak = big ? 0.75 : 0.5;

    chromaRed.style.transform = 'translateX(' + (-offset) + 'px)';
    chromaRed.style.background = big ? 'rgba(255,255,255,0.9)' : 'rgba(255,40,90,0.7)';
    chromaCyan.style.transform = 'translateX(' + offset + 'px)';
    chromaCyan.style.background = 'rgba(0,220,255,0.7)';

    [chromaRed, chromaCyan].forEach((el) => {
      el.style.setProperty('--chroma-peak', peak);
      el.style.animationDuration = duration + 'ms';
      el.classList.remove('show');
      void el.offsetWidth; // アニメーションを最初から再生させるためのリフロー
      el.classList.add('show');
    });

    setTimeout(() => {
      chromaRed.classList.remove('show');
      chromaCyan.classList.remove('show');
    }, duration + 20);
  }

  function updateFeverHpDisplay() {
    const current = Math.max(0, feverHp);
    feverHpIcons.innerHTML = '';
    for (let i = 0; i < FEVER_HP_MAX; i++) {
      const icon = document.createElement('span');
      icon.className = 'fever-hp-icon';
      icon.textContent = '🛡️';
      if (i >= current) {
        icon.classList.add('lost'); // 既に失われた耐久
      } else if (current === 1) {
        icon.classList.add('warning'); // 残り1つ:警告として点滅
      }
      feverHpIcons.appendChild(icon);
    }
  }

  function activateFever() {
    if (feverActive) return;
    feverActive = true;
    feverCount += 1;
    feverHp = FEVER_HP_MAX;
    barrierUseCount = 0;
    updateFeverHpDisplay();
    gaugeValue = GAUGE_MAX;
    updateGaugeDisplay();
    feverGaugeFill.classList.add('active');
    cardEl.classList.add('fever');
    feverTag.classList.add('show');
    feverBanner.classList.add('active'); // フィーバー中はずっと表示し続ける
    sfxFever();
    vibrate([20, 30, 20, 30, 60]);
    if (feverCount >= 2) unlockAchievement('feverTwice');
    switchBgmTo('fever', BGM_CROSSFADE_MS);
  }

  function deactivateFever() {
    if (!feverActive) return;
    feverActive = false;
    feverHp = 0;
    gaugeValue = 0;
    updateGaugeDisplay();
    feverGaugeFill.classList.remove('active');
    cardEl.classList.remove('fever');
    feverTag.classList.remove('show');
    feverBanner.classList.remove('active');
    switchBgmTo('normal', BGM_CROSSFADE_MS);
  }

  function unlockAchievement(id) {
    if (unlockedAchievements.indexOf(id) !== -1) return; // 既に達成済み
    const ach = ACHIEVEMENTS[id];

    unlockedAchievements.push(id);
    score += ach.bonus;
    updateHud();

    const chip = document.createElement('span');
    chip.className = 'achievement-chip';
    chip.textContent = '🏆 ' + ach.name + ' +' + ach.bonus;
    achievementList.appendChild(chip);

    achievementToastQueue.push(ach);
    showNextAchievementToast();
    sfxAchievement();
    vibrate([25, 20, 25, 20, 70]);

  function showNextAchievementToast() {
    if (achievementToastShowing || achievementToastQueue.length === 0) return;

      flashOverlay.style.opacity = '0';
    });

  function setZoom(target) {
    zoomLevel = target;

  function visualPos() {

  function spawnParticles(color, count) {
    const rect = stage.getBoundingClientRect();
    const originX = (visualPos() / 100) * rect.width;
    const originY = rect.height / 2;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 50;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      p.style.left = originX + 'px';
      p.style.top = originY + 'px';
      p.style.background = color;
      p.style.boxShadow = '0 0 6px ' + color;
      particleLayer.appendChild(p);
      setTimeout(() => p.remove(), 650);
    }
  }

    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');

      particleLayer.appendChild(s);
      setTimeout(() => s.remove(), 360);

  function spawnFinalSlashes(count) {
    // ラストミス専用:大きく・長く残る赤い斬撃。スロー演出+フェードの尺(約1.45秒)に合わせて消える

    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'slash slash-final';
      const rot = angles[i % angles.length] + (Math.random() - 0.5) * 14;
      s.style.setProperty('--rot', rot + 'deg');
      s.style.left = visualPos() + '%';
      s.style.top = '50%';

  function spawnBarrierRipple(borderColor, glowColor) {

    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* unsupported */ }

  // === サウンドエンジン(音声ファイル不要、Web Audioでその場合成) ===
  let audioCtx = null;

  const sfxBuffers = { miss: null, hit: null, crit: null, barrier1: null, barrier2: null, barrier3: null };
  let sfxBuffersLoading = false;

  function base64ToArrayBuffer(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  function loadSfxBuffers() {
    if (!audioCtx || sfxBuffersLoading) return;
    sfxBuffersLoading = true;
    Object.keys(SFX_DATA_URI).forEach((key) => {
      if (sfxBuffers[key]) return;
      const base64 = SFX_DATA_URI[key].split(',')[1];
      const arrayBuffer = base64ToArrayBuffer(base64);
      audioCtx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
        sfxBuffers[key] = buffer;
      }, (err) => { /* デコード失敗時は合成音にフォールバック */ });
    });
  }

  function playSfxBuffer(key, peak) {
    if (!soundEnabled || !audioCtx || !sfxBuffers[key]) return false;
    const source = audioCtx.createBufferSource();
    source.buffer = sfxBuffers[key];
    const gain = audioCtx.createGain();
    gain.gain.value = peak != null ? peak : 0.5;
    source.connect(gain).connect(audioCtx.destination);
    source.start();
    return true;
  }

  const BGM_VOLUME = 0.35;
  const BGM_CROSSFADE_MS = 700;
  const FEVER_LOOP_FADE_SEC = 3; // フィーバーBGMのループ点でのクロスフェード時間
  // 実測(volumedetect)した平均音量: 通常(BGM_N4)-16.6dB / フィーバー(BGM_F2)-15.9dB
  // 元々ほぼ互角(フィーバーが+0.7dB)なので、そこから+約2dB分だけ追加ブーストして
  // 「少し大きめ」に聴こえるよう調整(ピーク音量にまだ余裕がある範囲に抑えている)
  const bgmTracks = {
    normal: { dataUri: BGM_DATA_URI, buffer: null, loading: false, volumeMultiplier: 1 },
    fever: { dataUri: BGM_FEVER_DATA_URI, buffer: null, loading: false, volumeMultiplier: 1.15 }
  };
  let bgmWantKey = null; // 現在鳴らしたいトラック('normal' | 'fever' | null)
  let bgmActiveKey = null;
  let bgmActiveSource = null;
  let bgmActiveGain = null;
  let feverLoopTimer = null;
  let feverLoopGeneration = 0; // 世代番号。切り替わったら古い予約をすべて無効化する

  function loadBgmTrack(key) {
    const track = bgmTracks[key];
    if (!audioCtx || track.buffer || track.loading) return;
    track.loading = true;
    const base64 = track.dataUri.split(',')[1];
    const arrayBuffer = base64ToArrayBuffer(base64);
    audioCtx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
      track.buffer = buffer;
      if (bgmWantKey === key && bgmActiveKey !== key) {
        switchBgmTo(key, BGM_CROSSFADE_MS);
      }
    }, (err) => { /* デコード失敗時は無音のまま */ });
  }

  function stopFeverLoop() {
    feverLoopGeneration += 1; // 予約済みの次ループ生成を無効化
    if (feverLoopTimer) {
      clearTimeout(feverLoopTimer);
      feverLoopTimer = null;
    }
  }

  // フィーバーBGM専用:終端手前3秒からフェードアウトしつつ、次の頭出しを3秒フェードインで重ねてループする
  function startFeverLoopSegment(track, gen, startAt, fadeInSec) {
    if (!audioCtx || gen !== feverLoopGeneration) return; // 別トラックへ切り替わっていたら何もしない

    const now = audioCtx.currentTime;
    const startTime = Math.max(startAt, now);
    const duration = track.buffer.duration;
    const targetVolume = soundEnabled ? BGM_VOLUME * track.volumeMultiplier : 0.0001;

    const source = audioCtx.createBufferSource();
    source.buffer = track.buffer;
    source.loop = false; // 自前でループ制御するためネイティブループは使わない
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.linearRampToValueAtTime(targetVolume, startTime + fadeInSec);
    source.connect(gain).connect(audioCtx.destination);
    source.start(startTime);

    const fadeOutStart = startTime + duration - FEVER_LOOP_FADE_SEC;
    gain.gain.setValueAtTime(targetVolume, fadeOutStart);
    gain.gain.linearRampToValueAtTime(0.0001, fadeOutStart + FEVER_LOOP_FADE_SEC);

    bgmActiveSource = source;
    bgmActiveGain = gain;

    const cleanupDelayMs = (startTime + duration - now) * 1000 + 100;
    setTimeout(() => {
      try { source.stop(); } catch (e) { /* already stopped */ }
      source.disconnect();
      gain.disconnect();
    }, Math.max(0, cleanupDelayMs));

    const nextStartAt = fadeOutStart;
    const leadMs = 250; // 生成自体は少し前倒しで行い、開始時刻はstartTimeで正確に合わせる
    const delayMs = Math.max(0, (nextStartAt - now) * 1000 - leadMs);
    feverLoopTimer = setTimeout(() => {
      startFeverLoopSegment(track, gen, nextStartAt, FEVER_LOOP_FADE_SEC);
    }, delayMs);
  }

  function switchBgmTo(key, fadeMs) {
    bgmWantKey = key;
    if (!audioCtx) return;
    const track = bgmTracks[key];
    if (!track.buffer) {
      loadBgmTrack(key); // ロード完了後、自動でクロスフェード開始
      return;
    }
    if (bgmActiveKey === key) return; // 既に再生中

    const now = audioCtx.currentTime;
    const fadeSec = fadeMs / 1000;

    // 旧トラック(直前まで鳴っていたもの)への参照を先に確保しておく
    const oldSource = bgmActiveSource;
    const oldGain = bgmActiveGain;

    // 直前がフィーバーループ中だった場合、予約済みの次ループ生成を止める
    stopFeverLoop();

    if (key === 'fever') {
      feverLoopGeneration += 1;
      const gen = feverLoopGeneration;
      startFeverLoopSegment(track, gen, now, fadeSec); // 内部でbgmActiveSource/Gainを更新する
    } else {
      // 新トラックをフェードインしながら開始(通常トラックはこれまで通りネイティブループ)
      const newSource = audioCtx.createBufferSource();
      newSource.buffer = track.buffer;
      newSource.loop = true;
      const newGain = audioCtx.createGain();
      newGain.gain.setValueAtTime(0.0001, now);
      const targetVolume = BGM_VOLUME * track.volumeMultiplier;
      newGain.gain.linearRampToValueAtTime(soundEnabled ? targetVolume : 0.0001, now + fadeSec);
      newSource.connect(newGain).connect(audioCtx.destination);
      newSource.start(0);

      bgmActiveSource = newSource;
      bgmActiveGain = newGain;
    }

    // 旧トラックをフェードアウトしながら停止(通常→フィーバー間の自然な切り替え)
    if (oldGain) {
      oldGain.gain.cancelScheduledValues(now);
      oldGain.gain.setValueAtTime(Math.max(oldGain.gain.value, 0.0001), now);
      oldGain.gain.linearRampToValueAtTime(0.0001, now + fadeSec);
      setTimeout(() => {
        try { oldSource.stop(); } catch (e) { /* already stopped */ }
        oldSource.disconnect();
        oldGain.disconnect();
      }, fadeMs + 60);
    }

    bgmActiveKey = key;
  }

  function startBgm() {
    switchBgmTo('normal', 800);
  }

  function stopBgmWithFade() {
    bgmWantKey = null;
    bgmActiveKey = null;
    stopFeverLoop(); // フィーバーループ中だった場合、次ループ予約を止める
    if (!audioCtx || !bgmActiveGain) return;
    const now = audioCtx.currentTime;
    const node = bgmActiveSource;
    const gain = bgmActiveGain;
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.0001), now);
    gain.gain.linearRampToValueAtTime(0.0001, now + 0.9);
    bgmActiveSource = null;
    bgmActiveGain = null;
    setTimeout(() => {
      try { node.stop(); } catch (e) { /* already stopped */ }
      node.disconnect();
      gain.disconnect();
    }, 950);
  }

  // === 蘇生チャンス(himechanの約束)専用BGM ===
  // 実測(volumedetect): 通常BGM(BGM_N4)-16.6dB / 蘇生BGM(BGM_hime)-17.8dB
  // 通常BGMに音量を合わせるため約+1.2dB(倍率1.14)を補正
  const REVIVAL_BGM_VOLUME_MULTIPLIER = 1.14;
  let revivalBgmBuffer = null;
  let revivalBgmLoading = false;
  let revivalBgmSource = null;
  let revivalBgmGain = null;

  function loadRevivalBgmBuffer() {
    if (!audioCtx || revivalBgmBuffer || revivalBgmLoading) return;
    revivalBgmLoading = true;
    const base64 = BGM_HIME_DATA_URI.split(',')[1];
    const arrayBuffer = base64ToArrayBuffer(base64);
    audioCtx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
      revivalBgmBuffer = buffer;
    }, (err) => { /* デコード失敗時は無音のまま(蘇生QTE自体には影響しない) */ });
  }

  function startRevivalBgm() {
    if (!audioCtx || !revivalBgmBuffer) return;
    stopRevivalBgmImmediate();
    revivalBgmSource = audioCtx.createBufferSource();
    revivalBgmSource.buffer = revivalBgmBuffer;
    revivalBgmSource.loop = true;
    revivalBgmGain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    const target = soundEnabled ? BGM_VOLUME * REVIVAL_BGM_VOLUME_MULTIPLIER : 0.0001;
    revivalBgmGain.gain.setValueAtTime(0.0001, now);
    revivalBgmGain.gain.linearRampToValueAtTime(target, now + 0.35); // 緊張感を出すため早めにフェードイン
    revivalBgmSource.connect(revivalBgmGain).connect(audioCtx.destination);
    revivalBgmSource.start(0);
  }

  function stopRevivalBgmImmediate() {
    if (!revivalBgmSource) return;
    const node = revivalBgmSource;
    const gain = revivalBgmGain;
    revivalBgmSource = null;
    revivalBgmGain = null;
    if (audioCtx && gain) {
      const now = audioCtx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.0001), now);
      gain.gain.linearRampToValueAtTime(0.0001, now + 0.3);
    }
    setTimeout(() => {
      try { node.stop(); } catch (e) { /* already stopped */ }
      node.disconnect();
      if (gain) gain.disconnect();
    }, 350);
  }

  // === リザルト画面BGM(ハイスコア未達成/更新時で出し分け、クロスフェード対応) ===
  // 実測(volumedetect): 通常BGM基準-16.6dB
  //   FFXIV_Quest_Complete: 平均-12.9dB(かなり大きくピークも0dB)→ 約-3.7dB分絞って基準に合わせる(倍率0.65)
  //   BGM_result_h: 平均-18.1dB(基準よりやや小さい)→ +2.5dB分持ち上げて基準よりわずかに華やかに(倍率1.33)
  const resultBgmTracks = {
    normal: { dataUri: RESULT_NORMAL_DATA_URI, buffer: null, loading: false, volumeMultiplier: 0.65 },
    best: { dataUri: RESULT_BEST_DATA_URI, buffer: null, loading: false, volumeMultiplier: 1.33 }
  };
  let resultBgmWantKey = null;
  let resultBgmActiveKey = null;
  let resultBgmActiveSource = null;
  let resultBgmActiveGain = null;

  function loadResultBgmTrack(key) {
    const track = resultBgmTracks[key];
    if (!audioCtx || track.buffer || track.loading) return;
    track.loading = true;
    const base64 = track.dataUri.split(',')[1];
    const arrayBuffer = base64ToArrayBuffer(base64);
    audioCtx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
      track.buffer = buffer;
      if (resultBgmWantKey === key && resultBgmActiveKey !== key) {
        switchResultBgmTo(key, 500);
      }
    }, (err) => { /* デコード失敗時は無音のまま */ });
  }

  function switchResultBgmTo(key, fadeMs) {
    resultBgmWantKey = key;
    if (!audioCtx) return;
    const track = resultBgmTracks[key];
    if (!track.buffer) {
      loadResultBgmTrack(key);
      return;
    }
    if (resultBgmActiveKey === key) return;

    const now = audioCtx.currentTime;
    const fadeSec = fadeMs / 1000;
    const target = soundEnabled ? BGM_VOLUME * track.volumeMultiplier : 0.0001;

    const newSource = audioCtx.createBufferSource();
    newSource.buffer = track.buffer;
    newSource.loop = (key === 'best'); // 通常リザルトBGMはループしない。スコア更新時のBGMのみループ継続
    const newGain = audioCtx.createGain();
    newGain.gain.setValueAtTime(0.0001, now);
    newGain.gain.linearRampToValueAtTime(target, now + fadeSec);
    newSource.connect(newGain).connect(audioCtx.destination);
    newSource.start(0);

    const oldSource = resultBgmActiveSource;
    const oldGain = resultBgmActiveGain;
    if (oldGain) {
      oldGain.gain.cancelScheduledValues(now);
      oldGain.gain.setValueAtTime(Math.max(oldGain.gain.value, 0.0001), now);
      oldGain.gain.linearRampToValueAtTime(0.0001, now + fadeSec);
      setTimeout(() => {
        try { oldSource.stop(); } catch (e) { /* already stopped */ }
        oldSource.disconnect();
        oldGain.disconnect();
      }, fadeMs + 60);
    }

    resultBgmActiveKey = key;
    resultBgmActiveSource = newSource;
    resultBgmActiveGain = newGain;
  }

  function stopResultBgm() {
    resultBgmWantKey = null;
    resultBgmActiveKey = null;
    if (!audioCtx || !resultBgmActiveGain) return;
    const now = audioCtx.currentTime;
    const node = resultBgmActiveSource;
    const gain = resultBgmActiveGain;
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.0001), now);
    gain.gain.linearRampToValueAtTime(0.0001, now + 0.4);
    resultBgmActiveSource = null;
    resultBgmActiveGain = null;
    setTimeout(() => {
      try { node.stop(); } catch (e) { /* already stopped */ }
      node.disconnect();
      gain.disconnect();
    }, 450);
  }

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { audioCtx = null; }
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    if (audioCtx) {
      loadSfxBuffers();
      loadBgmTrack('normal');
      loadBgmTrack('fever');
      loadRevivalBgmBuffer();
      loadResultBgmTrack('normal');
      loadResultBgmTrack('best');
    }
  }

  function playTone(freq, duration, type, delay, peak, sweepTo) {
    if (!soundEnabled || !audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime((peak != null ? peak : SFX_VOLUME), t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  function playNoiseBurst(duration, delay, peak, filterFreq) {
    if (!soundEnabled || !audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq || 900;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(peak != null ? peak : SFX_VOLUME, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    noise.connect(filter).connect(gain).connect(audioCtx.destination);
    noise.start(t0);
  }

  // 帯域が高音→低音へ素早く動くノイズ:刃が空気を切る「シャッ」という風切り音
  function playSlashNoise(duration, delay, peak, freqStart, freqEnd) {
    if (!soundEnabled || !audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 5;
    filter.frequency.setValueAtTime(freqStart, t0);
    filter.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 40), t0 + duration);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    noise.connect(filter).connect(gain).connect(audioCtx.destination);
    noise.start(t0);
  }

  // 高Qの帯域フィルターを通した正弦波:金属やガラスが「キン」と共鳴する響き
  function playRing(freq, duration, delay, peak, detune, q, type) {
    if (!soundEnabled || !audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    if (detune) osc.detune.setValueAtTime(detune, t0);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = q || 14;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(filter).connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  // 高音のringを複数バラけて鳴らす:ガラスが砕け散るイメージ
  function playGlassShatter(count, delay, peak) {
    for (let i = 0; i < count; i++) {
      const freq = 3000 + Math.random() * 3200;
      const d = (delay || 0) + i * 0.011 + Math.random() * 0.008;
      playRing(freq, 0.045 + Math.random() * 0.03, d, peak * (0.55 + Math.random() * 0.45), (Math.random() - 0.5) * 40);
    }
  }

  // 複数のインハーモニックな倍音を重ねる:鋼同士がぶつかった時の金属の余韻(グラスより濁りがあり、鋭さより「鈍い煌めき」)
  function playSteelClang(delay, peak, big) {
    const base = big ? 1500 : 1950;
    const partials = big ? [1, 1.42, 2.05, 2.9] : [1, 1.48, 2.1];
    const dur = big ? 0.26 : 0.17;
    partials.forEach((mult, i) => {
      playRing(
        base * mult + (Math.random() * 40 - 20),
        dur - i * 0.02,
        (delay || 0) + i * 0.006,
        peak * (1 - i * 0.2),
        (Math.random() - 0.5) * 20,
        8,
        'sawtooth'
      );
    });
  }

  // 刃が空気を切る「シャッ」という風切り音+立ち上がりの鋭いアタック音
  function playSwordWhoosh(duration, delay, peak, freqStart, freqEnd) {
    playSlashNoise(duration, delay || 0, peak, freqStart, freqEnd);
    playNoiseBurst(0.014, delay || 0, peak * 0.55, freqStart * 1.1);
  }

  // 剣で斬りつけた一撃:風切り音+金属の衝突音を組み合わせた本命の斬撃SE
  function playSwordSlash(delay, peak, big) {
    playSwordWhoosh(big ? 0.1 : 0.06, delay, peak, big ? 7200 : 5200, big ? 700 : 1100);
    playSteelClang((delay || 0) + 0.012, peak * 0.9, !!big);
  }

  // 空振り:金属音を伴わない、刃が空を切るだけの音
  function playSwordMiss(delay, peak) {
    playSlashNoise(0.11, delay || 0, peak, 5000, 480);
  }

  function sfxHit() {
    // 添付の「剣で打ち合う2」を使用。未ロード時は合成音にフォールバック
    if (!playSfxBuffer('hit', 0.55)) playSwordSlash(0, 0.2, false);
  }
  function sfxCrit() {
    // 添付の「剣で打ち合う3」を使用
    if (!playSfxBuffer('crit', 0.6)) playSwordSlash(0, 0.28, true);
  }
  function sfxPerfect() {
    // クリティカル音源+弾けるような煌めきを追加
    if (!playSfxBuffer('crit', 0.65)) playSwordSlash(0, 0.32, true);
    playGlassShatter(4, 0.04, 0.13);
  }
  function sfxNearMiss() {
    // 添付の「剣の素振り1」を使用(控えめな音量)
    if (!playSfxBuffer('miss', 0.35)) playSwordMiss(0, 0.15);
  }
  function sfxMiss() {
    // 添付の「剣の素振り1」を使用
    if (!playSfxBuffer('miss', 0.55)) playSwordMiss(0, 0.2);
  }
  function sfxFinalMiss() {
    // 素振り音+ガラスが砕け散るような破砕音で締める
    if (!playSfxBuffer('miss', 0.7)) playSwordMiss(0, 0.26);
    playGlassShatter(9, 0.03, 0.18);
    playTone(120, 0.5, 'sawtooth', 0.05, 0.22, 40);
  }
  function sfxFever() {
    // 鋭い斬撃の連打(畳み掛けるような煌めき)
    [0, 0.1, 0.2, 0.3].forEach((d, i) => {
      playSwordSlash(d, 0.18, i >= 2);
    });
  }
  function sfxBarrierBreak() {
    // フィーバー中限定:添付のバリア破裂音を使用回数(1〜3回目)に応じて出し分ける
    // BGM(実効音量 約0.40)よりも少し大きめに聴こえるよう0.55に設定
    barrierUseCount += 1;
    const key = 'barrier' + Math.min(barrierUseCount, 3);
    if (!playSfxBuffer(key, 0.55)) {
      // 未ロード時のフォールバック:シールドに弾かれた軽い金属音
      playRing(2600, 0.09, 0, 0.16, 15, 10, 'triangle');
      playRing(3400, 0.06, 0.01, 0.09, -10, 10, 'triangle');
    }
  }
  function sfxFeverWarning() {
    // フィーバー耐久が残り1になった瞬間の警告音(上ずる短いベル)
    playTone(1200, 0.12, 'sine', 0, 0.12, 1900);
  }
  function sfxHeal() {
    // クリティカルでの回復:柔らかく上昇するベルの響き
    playRing(1400, 0.16, 0, 0.13, 8, 12, 'sine');
    playRing(2100, 0.14, 0.05, 0.1, 8, 12, 'sine');
  }

  function healEffect() {
    // 回復したハート(一番左の未充填ハート)だけを軽くパルスさせる
    const heartSlots = livesLabel.querySelectorAll('.heart-slot');
    const healedIndex = Math.min(heartSlots.length - 1, Math.max(0, Math.ceil(lives) - 1));
    const target = heartSlots[healedIndex];
    if (target) {
      target.classList.remove('healing');
      void target.offsetWidth;
      target.classList.add('healing');
    }

    // 「+HP」のポップアップをハート付近にふわっと表示
    const popup = document.createElement('div');
    popup.className = 'heal-popup';
    popup.textContent = '+HP';
    healPopupLayer.appendChild(popup);
    setTimeout(() => popup.remove(), 950);

    sfxHeal();
  }

  function sfxAchievement() {
    // ガラスの粒+金属チャイムで華やかに
    playGlassShatter(3, 0, 0.15);
    [2800, 3600, 4400].forEach((f, i) => {
      playRing(f, 0.14, i * 0.06, 0.18);
    });
  }

  function celebrateNewBest() {
    // 自己ベスト更新:バナー表示+紙吹雪+華やかなSE+振動
    switchResultBgmTo('best', 400); // リザルトBGMを「更新時」用にクロスフェード
    newBestBanner.classList.remove('show');
    void newBestBanner.offsetWidth; // アニメーションを最初から再生
    newBestBanner.classList.add('show');

    const colors = ['#ffd66b', '#6fd6e0', '#e8a355', '#ff8fd0', '#ffffff'];
    confettiLayer.innerHTML = '';
    for (let i = 0; i < 46; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (1.1 + Math.random() * 0.9) + 's';
      piece.style.animationDelay = (Math.random() * 0.4) + 's';
      piece.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
      confettiLayer.appendChild(piece);
    }
    setTimeout(() => { confettiLayer.innerHTML = ''; }, 2600);

    playGlassShatter(6, 0, 0.16);
    [1600, 2000, 2500, 3200].forEach((f, i) => {
      playRing(f, 0.18, i * 0.07, 0.2);
    });
    sfxAchievement();
    vibrate([30, 40, 30, 40, 80]);
  }

  function spawnTapRipple(xPct, yPct) {
    const r = document.createElement('div');
    r.className = 'tap-ripple';
    r.style.left = xPct + '%';
    r.style.top = yPct + '%';
    particleLayer.appendChild(r);
    setTimeout(() => r.remove(), 420);
  }

  function updateGaugeDisplay() {
    feverGaugeFill.style.width = Math.min(100, Math.max(0, gaugeValue)) + '%';
  }

  function tick(t) {
    if (lastFrameTime === null) lastFrameTime = t;
    const dt = (t - lastFrameTime) / 1000;
    lastFrameTime = t;
    if (t >= freezeUntil) {
      const speed = Math.min(1 + successCount * 0.07, 1.6);
      const period = 1.4 / speed;
      const angularSpeed = (Math.PI * 2) / period;
      phase += dt * angularSpeed;

      // フィーバーゲージの自然減衰:バー3往復でコンボ1回分程度減る速度
      if (!feverActive && gaugeValue > 0) {
        const decayPerSecond = GAUGE_PER_HIT / (3 * period);
        gaugeValue = Math.max(0, gaugeValue - decayPerSecond * dt);
        updateGaugeDisplay();
      }
    }
    const raw = (Math.sin(phase) + 1) / 2;
    cursorPos = raw * 100;
    cursor.style.left = cursorPos + '%';
    rafId = requestAnimationFrame(tick);
  }

  function startGame() {
    ensureAudio(); // ユーザー操作(ボタン押下)のタイミングでAudioContextを起動
    stopResultBgm(); // 前回のリザルトBGMが残っていれば止める
    startBgm();
    score = 0;
    combo = 0;
    maxCombo = 0;
    lives = MAX_LIVES;
    hasMissedThisGame = false;
    pendingHealEffect = false;
    hasRevivalChance = false;
    revivalQteActive = false;
    revivalLocked = false;
    revivalSuccessCount = 0;
    revivalMissCount = 0;
    revivalFreezeUntil = 0;
    cancelAnimationFrame(revivalRafId);
    revivalOverlay.classList.remove('show');
    successCount = 0;
    phase = -Math.PI / 2;
    lastFrameTime = null;
    freezeUntil = 0;
    locked = false;
    waitingForFirstTap = true;
    trackInner.classList.remove('zoom-out-slow');
    setZoom(1);
    rootEl.classList.remove('final-miss');
    deactivateFever();
    gaugeValue = 0;
    updateGaugeDisplay();
    feverBanner.classList.remove('active');
    unlockedAchievements = [];
    achievementToastQueue = [];
    achievementToastShowing = false;
    achievementToast.classList.remove('show');
    achievementList.innerHTML = '';
    critStreak = 0;
    lastWasNearMiss = false;
    feverCount = 0;
    feverHp = 0;
    updateFeverHpDisplay();
    comboPopup.classList.remove('show');
    startHint.style.display = 'block';
    idleView.style.display = 'none';
    doneView.style.display = 'none';
    doneView.classList.remove('fade-in-start');
    playView.classList.remove('fade-out');
    playView.style.display = 'block';
    newBestBanner.classList.remove('show');
    confettiLayer.innerHTML = '';
    flashEl.textContent = '';
    flashEl.className = 'result-flash';
    updateHud();
    cancelAnimationFrame(rafId);
    cursor.style.left = '0%'; // バー停止中は左端で待機
  }

  function beginMotion() {
    waitingForFirstTap = false;
    startHint.style.display = 'none';
    lastFrameTime = null;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }

  function hit(clientX, clientY) {
    if (locked) return;
    const rect = stage.getBoundingClientRect();
    tapXPct = Math.min(100, Math.max(0, ((clientX - rect.left) / rect.width) * 100));
    tapYPct = Math.min(100, Math.max(0, ((clientY - rect.top) / rect.height) * 100));
    spawnTapRipple(tapXPct, tapYPct);

    const result = judge(cursorPos);
    locked = true;

    let freezeMs;

    if (result.type === 'miss' || result.type === 'nearMiss') {
      const isNearMiss = result.type === 'nearMiss';
      const wasFeverActive = feverActive; // 判定後に状態が変わるため、先に保持しておく
      critStreak = 0;

      if (wasFeverActive) {
        // フィーバー中はミスしても本体のライフを消費せず、専用の耐久値だけを減らす
        feverHp -= 1;
        updateFeverHpDisplay();
      } else {
        lives -= 1;
        hasMissedThisGame = true;
      }

      const feverJustEnded = wasFeverActive && feverHp <= 0;
      // 通常のミス挙動(コンボ・バー速度・ゲージのリセット)を適用するかどうか:
      // フィーバー継続中は完全にスキップし、フィーバー終了時のみ(何がきっかけでも)通常挙動に戻す
      const shouldResetTempo = feverJustEnded || (!wasFeverActive && !isNearMiss);

      if (isNearMiss) {
        lastWasNearMiss = true; // 直後にクリティカルを当てると実績「紙一重」
      } else {
        lastWasNearMiss = false;
      }

      if (shouldResetTempo) {
        combo = 0;
        successCount = 0; // バー速度をリセット
        gaugeValue = 0;
        updateGaugeDisplay();
      }

      if (feverJustEnded) {
        deactivateFever(); // 耐久が尽きたら通常モードへ(本体のライフはノーダメージのまま)
      }

      const isFinalMiss = lives <= 0;
      flashEl.textContent = isNearMiss ? 'ニアミス！' : 'ミス！';
      flashEl.className = 'result-flash miss';

      if (wasFeverActive) {
        // フィーバー中限定:痛みではなく「シールドに弾かれた」演出に統一(無敵感)
        const feverMissColor = '#ffd76a';
        spawnParticles(feverMissColor, isNearMiss ? 12 : 20);
        spawnRing(feverMissColor);
        spawnBarrierRipple(); // 画面全体に広がる青い波紋
        overlayFlash('rgba(255,215,120,0.32)');
        bgFlash('bg-flash-fever-miss');
        shake('shake-shield');
        sfxBarrierBreak();
        vibrate(isNearMiss ? 15 : [15, 15, 15]);
        freezeMs = isNearMiss ? 150 : 180;
        if (feverHp === 1) {
          sfxFeverWarning(); // 残り耐久1での警告音
        }
        if (shouldResetTempo) {
          setZoom(1); // フィーバー終了時はズームも初期値へ(通常のミス挙動)
        }
      } else if (isNearMiss && !isFinalMiss) {
        // ニアミス救済:ライフは減るがコンボ・ゲージ・速度は維持される
        spawnParticles('#e8a355', 14);
        spawnSlashes('#e8a355', '#e8a355', 1, 45, 40);
        spawnRing('#e8a355');
        overlayFlash('rgba(232,163,85,0.4)');
        bgFlash('bg-flash-miss');
        shake('shake-small');
        sfxNearMiss();
        vibrate(30);
        freezeMs = 200;
      } else {
        spawnParticles('#e0716f', isFinalMiss ? 42 : 18);
        if (isFinalMiss) {
          spawnFinalSlashes(6); // 大きく・長く残る赤い斬撃
        } else {
          spawnSlashes('#e0716f', '#e0716f', 2, 45, 90); // X字の破断エフェクト
        }
        spawnRing('#e0716f');
        bgFlash('bg-flash-miss');

        if (isFinalMiss) {
          // ラストミス:大袈裟なスロー演出+派手なエフェクト
          freezeMs = 950;
          overlayFlash('rgba(224,113,111,0.8)');
          spawnRing('#ffffff');
          shake('shake-mega');
          rootEl.classList.add('final-miss');
          sfxFinalMiss();
          vibrate([60, 40, 60, 40, 140]);
          // 現在のズームから、ゆっくりと引いていくズームアウト演出
          // 直前のズーム量に関わらず「常に一定の迫力」になるよう、現在値に対する相対値で引く
          trackInner.classList.add('zoom-out-slow');
          setZoom(zoomLevel * 0.65);
        } else {
          setZoom(1); // ミスでズームをリセット、ミス領域が再び見えるように
          freezeMs = 260;
          overlayFlash('rgba(224,113,111,0.55)');
          shake('shake-big');
          sfxMiss();
          vibrate([40, 30, 40]);
        }
      }
    } else {
      const isPerfect = result.type === 'perfectCrit';
      const isCrit = isPerfect || result.type === 'crit';
      const mult = feverActive ? 2 : 1;
      const gained = result.score * mult;
      score += gained;
      combo += 1;
      successCount += 1;
      freezeMs = isPerfect ? 190 : (isCrit ? 140 : 90);
      if (combo > maxCombo) maxCombo = combo;
      flashEl.textContent = result.label + '！ +' + gained;
      flashEl.className = 'result-flash ' + result.cls;

      // 成功するたびに少しずつ中央へズーム、ミス領域を視界から遠ざける
      setZoom(1 + Math.min(combo, 16) * 0.09);

      if (isCrit) {
        critStreak += 1;
      } else {
        critStreak = 0;
      }

      if (isCrit) {
        popCombo('#e8c27a', '#e8c27a'); // クリティカルゾーンの色(ゴールド)
        overlayFlash(isPerfect ? 'rgba(255,255,255,0.65)' : 'rgba(232,194,122,0.5)');
        spawnParticles('#e8c27a', isPerfect ? 42 : 26);
        spawnSlashes('#fff6df', '#e8c27a', isPerfect ? 5 : 3, -40, isPerfect ? 75 : 50);
        spawnRing('#e8c27a');
        if (isPerfect) spawnRing('#ffffff');
        shake('shake-small');
        bgFlash('bg-flash-crit');
        triggerChroma(isPerfect); // 色収差フラッシュ。パーフェクトはより強く
        if (isPerfect) sfxPerfect(); else sfxCrit();
        vibrate(isPerfect ? 35 : 25);
        const willHeal = lives < MAX_LIVES; // ハート回復が実際に発動するかどうか
        if (isPerfect) {
          spawnPop('PERFECT!!', '#ffffff');
        } else if (combo > 0 && combo % 5 === 0) {
          spawnPop(combo + ' COMBO!!', '#e8c27a');
          spawnParticles('#e8c27a', 30);
        } else {
          spawnPop('CRITICAL!', '#e8c27a');
        }
        if (willHeal) spawnHealPop();
        spawnScorePop(gained, '#e8c27a');

        // クリティカルのたびにハート1/4分だけ回復(満タン時は発動しない)
        if (willHeal) {
          lives = Math.min(MAX_LIVES, lives + HEART_HEAL_AMOUNT);
          pendingHealEffect = true; // renderHearts()完了後にエフェクトを発火させるため保留
        }
      } else {
        popCombo('#6fd6e0', '#6fd6e0'); // ヒットゾーンの色(アザーブルー)
        overlayFlash('rgba(111,214,224,0.35)');
        spawnParticles('#6fd6e0', 14);
        spawnSlashes('#d9fbff', '#6fd6e0', 1, -40, 20);
        spawnRing('#6fd6e0');
        spawnPop('Hit!', '#6fd6e0');
        spawnScorePop(gained, '#6fd6e0');
        sfxHit();
        vibrate(12);
      }
      comboLabel.classList.remove('combo-pop');
      void comboLabel.offsetWidth;
      comboLabel.classList.add('combo-pop');

      // 成功のたびにフィーバーゲージが上昇、満タンでフィーバータイム突入(スコア倍率x2)
      if (!feverActive) {
        gaugeValue = Math.min(GAUGE_MAX, gaugeValue + GAUGE_PER_HIT);
        updateGaugeDisplay();
        if (gaugeValue >= GAUGE_MAX) {
          activateFever();
        }
      }

      // 実績判定(条件は非公開。達成した瞬間に初めて表示される)
      if (isCrit && lastWasNearMiss) unlockAchievement('nearMissRecover');
      lastWasNearMiss = false;
      if (critStreak >= 3) unlockAchievement('critStreak3');
      if (isPerfect) unlockAchievement('firstPerfect');
      if (isPerfect && feverActive) unlockAchievement('feverPerfect');
      if (combo >= 80) unlockAchievement('combo20');
      if (score >= 10000) unlockAchievement('score500');
      if (!hasMissedThisGame && score >= 5800) unlockAchievement('noMiss300');
      // HP満タン時に4連続クリティカル → 蘇生チャンス獲得(1ゲーム1回のみ、実績の重複解除ガードで担保)
      if (lives >= MAX_LIVES && critStreak >= 4 && unlockedAchievements.indexOf('himechanPromise') === -1) {
        unlockAchievement('himechanPromise');
        hasRevivalChance = true;
      }
    }

    updateHud();
    if (pendingHealEffect) {
      pendingHealEffect = false;
      healEffect(); // renderHearts()で最新のハート表示が確定した後に発火
    }

    // ヒットストップ:一瞬だけゲージの進行を止めて「連続攻撃」の重みを出す
    freezeUntil = performance.now() + freezeMs;

    setTimeout(() => {
      if (lives <= 0) {
        if (hasRevivalChance) {
          hasRevivalChance = false; // 消費(成功・失敗を問わず1ゲーム1回のみ)
          startRevivalQte();
        } else {
          finishGame();
        }
      } else {
        locked = false;
      }
    }, freezeMs);
  }

  function renderResultAchievements() {
    resultAchievements.innerHTML = '';
    if (unlockedAchievements.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'result-achievements-empty';
      empty.textContent = '今回の実績はありませんでした';
      resultAchievements.appendChild(empty);
      return;
    }
    unlockedAchievements.forEach((id) => {
      const ach = ACHIEVEMENTS[id];
      if (!ach) return;
      const chip = document.createElement('span');
      chip.className = 'achievement-chip';
      chip.textContent = '🏆 ' + ach.name + ' +' + ach.bonus;
      resultAchievements.appendChild(chip);
    });
  }

  function finishGame() {
    cancelAnimationFrame(rafId);
    lastFinalScore = score;
    lastMaxCombo = maxCombo;
    stopBgmWithFade();

    // プレイ画面をフェードアウトさせてからスコア画面をフェードイン
    playView.classList.add('fade-out');
    setTimeout(() => {
      playView.style.display = 'none';
      playView.classList.remove('fade-out');
      rootEl.classList.remove('final-miss');

      finalScoreEl.textContent = lastFinalScore;
      finalComboEl.textContent = '最大コンボ ' + lastMaxCombo;
      renderResultAchievements();
      doneView.style.display = 'block';
      doneView.classList.add('fade-in-start');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          doneView.classList.remove('fade-in-start');
        });
      });

      // リザルトBGM: まずは「未達成時」用として開始(自己ベスト判定はこの直後に行う)
      switchResultBgmTo('normal', 500);

      // サーバー保存はせず、このタブを開いている間だけのセッション内自己ベストと比較する
      if (lastFinalScore > sessionBestScore) {
        sessionBestScore = lastFinalScore;
        celebrateNewBest();
      }
    }, 500);
  }

  function sfxRevivalTense() {
    // QTE開始時の緊迫した上昇音
    playTone(220, 0.5, 'sawtooth', 0, 0.14, 480);
    playTone(330, 0.5, 'sawtooth', 0.05, 0.1, 620);
  }
  function sfxRevivalSuccess() {
    // 蘇生成功:光が満ちるような和音
    [660, 880, 1320, 1760].forEach((f, i) => {
      playRing(f, 0.4, i * 0.05, 0.18, 6, 8, 'sine');
    });
    playGlassShatter(5, 0.05, 0.15);
  }
  function sfxRevivalFail() {
    // 蘇生失敗:力尽きるような下降音
    playTone(300, 0.6, 'sawtooth', 0, 0.18, 60);
  }

  function renderRevivalDots() {
    revivalSuccessDots.innerHTML = '';
    for (let i = 0; i < REVIVAL_SUCCESS_NEEDED; i++) {
      const dot = document.createElement('span');
      if (i < revivalSuccessCount) dot.classList.add('filled-success');
      revivalSuccessDots.appendChild(dot);
    }
    revivalMissDots.innerHTML = '';
    for (let i = 0; i < REVIVAL_MISS_ALLOWED; i++) {
      const dot = document.createElement('span');
      if (i < revivalMissCount) dot.classList.add('filled-fail');
      revivalMissDots.appendChild(dot);
    }
  }

  function startRevivalQte() {
    revivalQteActive = true;
    revivalLocked = false;
    revivalSuccessCount = 0;
    revivalMissCount = 0;
    revivalFreezeUntil = 0;
    renderRevivalDots();
    revivalResult.textContent = '';
    revivalResult.className = 'revival-result';
    revivalPhase = -Math.PI / 2;
    revivalLastFrameTime = null;
    revivalCursorPos = 0;
    revivalCursor.style.left = '0%';
    stopBgmWithFade(); // 通常/フィーバーBGMを止める
    startRevivalBgm(); // 代わりに蘇生チャンス専用BGMを再生
    rootEl.classList.remove('final-miss'); // 直前のラストミス演出を解除しておく
    revivalOverlay.classList.add('show');
    sfxRevivalTense();
    vibrate([15, 40, 15, 40, 15, 40]);
    cancelAnimationFrame(revivalRafId);
    revivalRafId = requestAnimationFrame(revivalTick);
  }

  function revivalTick(t) {
    if (!revivalQteActive) return;
    if (revivalLastFrameTime === null) revivalLastFrameTime = t;
    const dt = (t - revivalLastFrameTime) / 1000;
    revivalLastFrameTime = t;
    if (t >= revivalFreezeUntil) {
      const period = 1.4 / 1.6; // 常に最大速度で緊張感を出す
      revivalPhase += dt * ((Math.PI * 2) / period);
    }
    const raw = (Math.sin(revivalPhase) + 1) / 2;
    revivalCursorPos = raw * 100;
    revivalCursor.style.left = revivalCursorPos + '%';
    revivalRafId = requestAnimationFrame(revivalTick);
  }

  function resolveRevivalTap() {
    if (!revivalQteActive || revivalLocked) return;

    const dist = Math.abs(revivalCursorPos - 50);
    const success = dist <= CRIT_HALF;
    revivalLocked = true;

    if (success) {
      revivalSuccessCount += 1;
      renderRevivalDots();
      spawnBarrierRipple('#ffe27a', 'rgba(255,226,122,0.85)');
      sfxRevivalSuccess();
      vibrate([25, 25, 25]);

      if (revivalSuccessCount >= REVIVAL_SUCCESS_NEEDED) {
        // 3回成功 → 蘇生成功
        revivalQteActive = false;
        cancelAnimationFrame(revivalRafId);
        stopRevivalBgmImmediate(); // 蘇生専用BGMを止め、通常BGMの再開に備える
        revivalResult.textContent = '<himechan> ご褒美ほしいな？ ( ⁎ᵕᴗᵕ⁎ )❤︎';
        revivalResult.className = 'revival-result success';
        playRaiseImageEffect();
        setTimeout(() => {
          revivalOverlay.classList.remove('show');
          reviveAndResume();
        }, 900);
      } else if (revivalSuccessCount === 1) {
        revivalResult.textContent = '<himechan> 私って天才すぎ？(* ˃ ᵕ ˂ )b';
        revivalResult.className = 'revival-result success';
        revivalFreezeUntil = performance.now() + 140; // ヒットストップ
        setTimeout(() => { revivalLocked = false; }, 260);
      } else {
        revivalResult.textContent = '<himechan> 私ってすごいでしょー！⸜( * ॑꒳ ॑* )⸝';
        revivalResult.className = 'revival-result success';
        revivalFreezeUntil = performance.now() + 140; // ヒットストップ
        setTimeout(() => { revivalLocked = false; }, 260);
      }
    } else {
      revivalMissCount += 1;
      renderRevivalDots();
      sfxRevivalFail();
      vibrate([50, 30, 50]);

      if (revivalMissCount >= REVIVAL_MISS_ALLOWED) {
        // 3回ミス → 蘇生失敗
        revivalQteActive = false;
        cancelAnimationFrame(revivalRafId);
        stopRevivalBgmImmediate(); // 蘇生専用BGMを止める(finishGame側で通常BGM停止処理も走るが無害)
        revivalResult.textContent = 'himechanさんがログアウトしました';
        revivalResult.className = 'revival-result fail';
        setTimeout(() => {
          revivalOverlay.classList.remove('show');
          finishGame();
        }, 2200);
      } else if (revivalMissCount === 1) {
        revivalResult.textContent = '<himechan> ネイル剥がれちゃって^^;';
        revivalResult.className = 'revival-result fail';
        revivalFreezeUntil = performance.now() + 260; // ヒットストップ(ミスの方をやや長めに)
        setTimeout(() => { revivalLocked = false; }, 320);
      } else {
        revivalResult.textContent = '<himechan> himeにはちょっとムリかも…(>_<)';
        revivalResult.className = 'revival-result fail';
        revivalFreezeUntil = performance.now() + 260; // ヒットストップ
        setTimeout(() => { revivalLocked = false; }, 320);
      }
    }
  }

  function reviveAndResume() {
    lives = MAX_LIVES;
    locked = false;
    trackInner.classList.remove('zoom-out-slow');
    setZoom(1);
    updateHud();
    startBgm(); // QTEで止めた音楽を再開
    beginMotion(); // タップ待ちを挟まず、すぐにバーを再始動
  }

  startBtn.addEventListener('click', startGame);
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
    if (audioCtx && bgmActiveGain) {
      const now = audioCtx.currentTime;
      const activeTrack = bgmActiveKey ? bgmTracks[bgmActiveKey] : null;
      const targetVolume = BGM_VOLUME * (activeTrack ? activeTrack.volumeMultiplier : 1);
      bgmActiveGain.gain.cancelScheduledValues(now);
      bgmActiveGain.gain.setValueAtTime(Math.max(bgmActiveGain.gain.value, 0.0001), now);
      bgmActiveGain.gain.linearRampToValueAtTime(soundEnabled ? targetVolume : 0.0001, now + 0.15);
    }
    if (audioCtx && resultBgmActiveGain) {
      const now = audioCtx.currentTime;
      const activeTrack = resultBgmActiveKey ? resultBgmTracks[resultBgmActiveKey] : null;
      const targetVolume = BGM_VOLUME * (activeTrack ? activeTrack.volumeMultiplier : 1);
      resultBgmActiveGain.gain.cancelScheduledValues(now);
      resultBgmActiveGain.gain.setValueAtTime(Math.max(resultBgmActiveGain.gain.value, 0.0001), now);
      resultBgmActiveGain.gain.linearRampToValueAtTime(soundEnabled ? targetVolume : 0.0001, now + 0.15);
    }
    if (soundEnabled) ensureAudio();
  });
  stage.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (waitingForFirstTap) {
      beginMotion();
      return; // 初回タップは合図のみ。攻撃判定はしない
    }
    hit(e.clientX, e.clientY);
  });
  revivalOverlay.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    resolveRevivalTap();
  });
  retryBtn.addEventListener('click', startGame);
})();
</script>
